<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ginormous Pour 2026 Planning</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; text-align: center; background: linear-gradient(#000c, #0000); z-index: 2; pointer-events: none; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header .count { font-size: 13px; opacity: .75; }
  .track { display: flex; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; padding: 60px 8px calc(env(safe-area-inset-bottom) + 40px); }
  .slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
  .dots { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 12px); left: 0; right: 0; display: flex; justify-content: center; gap: 8px; z-index: 2; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: #fff5; }
  .dots span.on { background: #fff; }
  .nav { position: fixed; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; border: 0; background: #0006; color: #fff; font-size: 28px; border-radius: 8px; cursor: pointer; z-index: 2; }
  .nav.prev { left: 8px; } .nav.next { right: 8px; }
  @media (pointer: coarse) { .nav { display: none; } }
</style>
</head>
<body>
<header><h1>Ginormous Pour 2026 Planning</h1><div class="count"><span id="cur">1</span> / <span id="tot"></span></div></header>
<div class="track" id="track"></div>
<button class="nav prev" aria-label="Previous">‹</button>
<button class="nav next" aria-label="Next">›</button>
<div class="dots" id="dots"></div>
<script>
  const images = ["images/12.jpg","images/11.jpg","images/10.jpg","images/09.jpg","images/08.jpg","images/07.jpg","images/06.jpg","images/05.jpg","images/04.jpg","images/03.jpg","images/02.jpg","images/01.jpg"];
  const track = document.getElementById('track'), dots = document.getElementById('dots');
  images.forEach((src, i) => {
    const s = document.createElement('div'); s.className = 'slide';
    const img = document.createElement('img'); img.src = src; img.alt = 'Image ' + (i+1); img.loading = i < 2 ? 'eager' : 'lazy';
    s.appendChild(img); track.appendChild(s);
    const d = document.createElement('span'); if (!i) d.className = 'on'; dots.appendChild(d);
  });
  document.getElementById('tot').textContent = images.length;
  let idx = 0;
  const go = n => track.scrollTo({ left: Math.max(0, Math.min(images.length-1, n)) * track.clientWidth, behavior: 'smooth' });
  track.addEventListener('scroll', () => {
    const n = Math.round(track.scrollLeft / track.clientWidth);
    if (n !== idx) { idx = n; document.getElementById('cur').textContent = n+1; [...dots.children].forEach((d,i) => d.classList.toggle('on', i===n)); }
  }, { passive: true });
  document.querySelector('.prev').onclick = () => go(idx-1);
  document.querySelector('.next').onclick = () => go(idx+1);
  document.addEventListener('keydown', e => { if (e.key==='ArrowLeft') go(idx-1); if (e.key==='ArrowRight') go(idx+1); });
</script>
</body>
</html>
